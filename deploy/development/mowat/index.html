<html lang="en">
<head>

  <link rel="canonical" href="https://m0clip.com/">
  <title>m0clip has moved</title>
</head>
<body>
  <main>
    <h1>m0clip has moved</h1>
    <p><a id="launch" href="https://m0clip.com/">Open m0clip.com</a></p>
  </main>
  <script>
    const target = new URL("https://m0clip.com/");
    target.search = location.search;

    document.getElementById("launch").href = target.href;
    location.replace(target.href);
