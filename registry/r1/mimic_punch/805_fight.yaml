control_ui:
  notice:
    title: Fight mode
    text: "This policy is a fight mode. The robot stands in a boxing guard and walks with the stick (W A S D / Q E or the left / right stick).\n\nTo fight, choose a move from the Moves list in the panel: hand strikes, kicks, footwork and defence, gestures and get down / get up. G / Shift+G steps through the moves; hover a button to see its remote-controller shortcut (on a gamepad LB/RB/LT/RT = L1/R1/L2/R2).\n\nAfter a fall or Get down the robot stays down until you pick Get up. Start stops a move."
  actions:
  - group: Hand strikes
    items:
    - {combo: R1+Up, label: Straight punch}
    - {combo: R1+Left, label: Left hook}
    - {combo: R1+Right, label: Right hook}
    - {combo: R1+Down, label: Low hook}
    - {combo: R1+Select, label: Straight-punch combo}
    - {combo: R2+Select, label: Attack combo}
  - group: Kicks
    items:
    - {combo: R2+Up, label: Front kick}
    - {combo: R2+Left, label: Left side kick}
    - {combo: R2+Right, label: Right side kick}
    - {combo: R2+Down, label: Knee kick}
  - group: Footwork / defence
    items:
    - {combo: Up, label: Turn around}
    - {combo: Left, label: Dodge left}
    - {combo: Right, label: Dodge right}
    - {combo: Down, label: Dodge back}
    - {combo: X, label: Block}
  - group: Gestures
    items:
    - {combo: B, label: Boxing stance}
    - {combo: A, label: Taunt 3}
    - {combo: Y, label: Taunt 2 (ready)}
  - group: Get down / up
    items:
    - {combo: L2+Down, label: Get down (front)}
    - {combo: L2+Left, label: Get down (back)}
    - {combo: L2+Up, label: Get up (after a fall / get down)}
  - group: Mode
    items:
    - {combo: Start, label: Stop move (Start ×2)}
