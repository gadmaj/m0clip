# R1 FSM 832: LocomotionGait (Stance R2+X), gait-clock walk
name: locomotion_gait/locomotion_gait
robot: r1_air
family: r1_fw
source: ai_sport 1.0.2.154 r1_controller (OTA 1.4.2.8)
control: {step_dt: 0.02, sim_dt: 0.002}
policy: {path: assets/policies/r1/motions/locomotion_gait/policy.onnx, num_act: 20}
r1:
  firmware: true
  fsm_id: 832
  models: [air, edu]
  obs_scheme: gait
  joint_names: [left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint, left_knee_joint, left_ankle_pitch_joint, left_ankle_roll_joint,
    right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint, right_knee_joint, right_ankle_pitch_joint, right_ankle_roll_joint,
    left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint, left_elbow_joint, right_shoulder_pitch_joint,
    right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_joint]
  memory: 10
  default_dof_pos: [-0.23, 0.03, -0.11, 0.22, -0.02, -0.04, -0.23, -0.03, 0.11, 0.22, -0.02, 0.04, 0.25, 0.2, -0.0, 0.8, 0.25,
    -0.2, 0.0, 0.8]
  action_scale: 0.25
  kp: [50, 50, 50, 50, 30, 30, 50, 50, 50, 50, 30, 30, 40, 40, 40, 40, 40, 40, 40, 40]
  kd: [4, 4, 4, 4, 3, 3, 4, 4, 4, 4, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3]
  vel_range: [-0.25, 0.45, -0.15, 0.15, -0.6, 0.6]
  default_vx_forward_limit: 0.45
  angular_coupling_strength: 0.3
  joystick_deadband: 0.08
  acc: [0.05, 0.1, 0.06, 0.1, 0.1, 0.16]
  gait: {walk_air_ratio: 0.42, run_air_ratio: 0.6, walk_cycle: 0.8, run_cycle: 0.5, transition_speed_min: 0.35, transition_speed_max: 0.9}
