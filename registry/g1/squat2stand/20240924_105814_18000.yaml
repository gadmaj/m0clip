# ai_sport 1.5.4 FsmSquat2Stand (FSM 703, entered from 203 only; no transition out). Decompiled humanoid
# (fsm_squat2stand.cpp) + EDU bench capture captures_154/probe5/703start (obs replayed to 5e-5, 93 % of the
# rt/lowcmd targets reproduced to 1e-4). Driver: src/core/drivers/g1_faceup.ts (G1Squat2StandDriver).
#   one 13-DOF LS2S net, 100 Hz, obs 46 = [gyro EMA(0.2) x0.25, projected gravity, q - default, dq EMA(0.2) x0.05,
#   clip(act,+-2) x action_scale (previous tick), traj_step_count/1600];
#   target = default + clip(act,+-2) x action_scale, limited so |kp(target-q) - kd dq_ema| <= joint_tau_limits;
#   kp/kd = this config's joint_kp/kd (measured in lowcmd), arms held at init_joint_q.
#   traj_step_count: 1000 standing (entry from a released 203), Start -> 1000..1400 squat down, 1400 squat,
#   Start -> 200..600 stand up, 600 stand, Start -> 1000 ... On the bench plant the first squat-down pitched
#   forward and fell; in the web model the full cycle works.
# The pack enters standing (203's stance, count 1000) and presses Start at squat2stand.presses (s).
