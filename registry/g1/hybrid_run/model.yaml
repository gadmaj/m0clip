# ai_sport FsmHybridRun (FSM 200, 2024 legacy loco; reached from 4 / 201-203 / 210 / 500 via LocoClient.SetFsmId).
# Decoded from the bench MNN I/O capture (1.5.4, EDU), replayed bit-exact (net out max|d| 3e-5):
#   input.1[400] = 10 x 40 frame, oldest first, 100 Hz; history refilled with the first frame on FSM entry
#   frame = gyro(lpf a=0.6)*0.25, (gravity+[0,0,1])*3, cmd[vx*2, vy*2, wz*0.25] (lpf a=0.03/tick),
#           (q-default)/action_scale (ankles lpf 10 Hz), dq(lpf a=0.2)*0.05,
#           [cos thL, cos thR, sin thL, sin thR] (gait clock, period 0.7 s, legs pi apart),
#           [0, (duty-0.4)/0.2 = 0.5, 0.2]
#   target = a*action_scale (legs, default 0); arms: shoulder pitch 0.3 + 0.4*vx*cos(th); legs kd x1.1 standing
name: hybrid_run/model.24_08_15_17_59_26_28800
robot: g1
family: g1_locomotion
control: {step_dt: 0.01, sim_dt: 0.0005, duration: 20.0}
policy: {path: assets/policies/g1/hybrid_run/model.24_08_15_17_59_26_28800.mnn, arch: legacy, num_obs: 400, num_act: 12}
g1:
  models: [air, edu]   # G1 variants it runs on (Air = machinetype 4, EDU = 5)
  fsm_id: 200
