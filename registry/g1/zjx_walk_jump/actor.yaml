    0.0, 0.0, 0.0, 0.0, 0.26, 0.14, -0.09, 0.96, 0.0, 0.0, 0.0, 0.26, -0.14, 0.09,
    0.96, 0.0, 0.0, 0.0]   # seated in 802's stance (the FSM is entered from 802)
  action_scale: 0.25
