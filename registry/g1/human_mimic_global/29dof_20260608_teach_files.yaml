#   dead zone min_root_pos_error 0.2, clip max_root_pos_error 1.0), rot6d of q_robot^-1 q_off q_ref];
#   idle / transit: [stance latent, 0,0,0, 1,0,0,1,0,0]. Motion rows: CSV rows time_start*fps .. time_end*fps, one
#   per 50 Hz tick whatever the fps; right after the last row the FSM exits to 802.
