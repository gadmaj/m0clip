# ai_sport FsmHumanMimicGlobal (FSM 550, entered by LocoClient.SetFsmId; motions picked by api_id), library 20260528_interactions.
# Decoded from the humanoid binary (fsm_human_mimic_global.cpp sub_4E16C0 / sub_4D4E50 / sub_4DFC10) + bench captures:
#   per-library decoder (+ global stance/decoder.onnx while idle), p_obs 10 x 93 as in 503;
#   cmd 137 = [latent(128) raw from the 135-col CSV, root pos error in the robot yaw frame (zero when mask_root_pos,
#   dead zone min_root_pos_error 0.2, clip max_root_pos_error 1.0), rot6d of q_robot^-1 q_off q_ref];
#   idle / transit: [stance latent, 0,0,0, 1,0,0,1,0,0]. Motion rows: CSV rows time_start*fps .. time_end*fps, one
#   per 50 Hz tick whatever the fps; right after the last row the FSM exits to 802.
# Bench captures (captures_154/probe3/550_601/507/526/574/chain, no odometry on the bench): entered with
#   SetFsmId(550000 + api_id) the motion starts at once; latent rows match exactly; the task part is pos 0 and a
#   rot6d within ~0.03 of identity (not reproduced by the decoded formula), so the pack feeds the identity task.
